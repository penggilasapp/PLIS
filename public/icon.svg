<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <!-- Background with squircle/rounded corner -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Washing Machine Body -->
  <rect x="96" y="80" width="320" height="352" rx="40" fill="#ffffff" stroke="#dbeafe" stroke-width="8" />
  
  <!-- Control Panel Top Bar -->
  <rect x="96" y="80" width="320" height="70" rx="40" fill="#eff6ff" />
  <rect x="96" y="120" width="320" height="30" fill="#eff6ff" />
  
  <!-- Knobs & Buttons -->
  <circle cx="150" cy="115" r="14" fill="#2563eb" />
  <circle cx="195" cy="115" r="8" fill="#94a3b8" />
  <circle cx="225" cy="115" r="8" fill="#94a3b8" />
  
  <!-- Digital Display Screen -->
  <rect x="270" y="100" width="110" height="30" rx="6" fill="#1e293b" />
  <text x="325" y="122" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">PLIS 58m</text>
  
  <!-- Outer Door Ring -->
  <circle cx="256" cy="275" r="115" fill="#f8fafc" stroke="#cbd5e1" stroke-width="8" />
  <circle cx="256" cy="275" r="95" fill="#38bdf8" opacity="0.25" stroke="#0284c7" stroke-width="6" />
  
  <!-- Water Waves Inside Drum -->
  <path d="M 175 295 Q 215 265 256 295 T 337 295 A 85 85 0 0 1 175 295 Z" fill="#0284c7" opacity="0.8" />
  
  <!-- Suds & Bubbles -->
  <circle cx="220" cy="245" r="16" fill="url(#bubbleGrad)" />
  <circle cx="275" cy="235" r="22" fill="url(#bubbleGrad)" />
  <circle cx="250" cy="210" r="12" fill="url(#bubbleGrad)" />
  <circle cx="295" cy="270" r="10" fill="url(#bubbleGrad)" />
  
  <!-- Sparkles on Top Corner -->
  <path d="M 390 50 L 398 68 L 416 76 L 398 84 L 390 102 L 382 84 L 364 76 L 382 68 Z" fill="#fbbf24" />
</svg>
